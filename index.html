<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="CSS/index.css">
</head>

<body>
    <div class="container">
        <form id="form-data" action="form.php" method="POST" enctype="multipart/form-data" onsubmit = "return formValidate()">
            <label for="firstName">First Name</label>
            <input type="text" name="firstName" id="first-name" placeholder="First Name" oninput="updateFullname()">
            <span id="first-name-error"></span>
            <label for="lastName">Last Name</label>
            <input type="text" name="lastName" id="last-name" placeholder="Last Name" oninput="updateFullname()">
            <span id="last-name-error"></span>
            <label for="fullName">Full Name</label>
            <input type="text" name="fullName" id="full-name" placeholder="Full Name" readonly>
            <label for="image">Select Image</label>
            <input type="file" name="chooseImg" id="chooseImg">
            <!-- Enter obtained marks -->
            <textarea name="addMarks" id="marks"></textarea>
            <!-- Enter phone number -->
            <label for="country-code">Select Country Code</label>
            <select id="country-code" name="country-code">
                <option value="+91">India (+91)</option>
                <option value="+1">USA (+1)</option>
                <option value="+44">UK (+44)</option>
                <option value="+61">Australia (+61)</option>
                <option value="+81">Japan (+81)</option>
            </select>
            <span id="country-error"></span>
            <label for="phone">Phone Number</label>
            <input type="tel" name="phone" id="phone" placeholder="Enter Phone Number">
            <span id="phone-error"></span>
            <!-- Enter email id -->
            <label for="email">Email-id</label>
            <input type="text" name="email" id="email" placeholder="Enter Mail Id">
            <span id="mail-error"></span>
            <span id="success-message"></span> <!-- Success message -->
            <button id="submit-btn">Submit</button>
        </form>
    </div>
</body>

</html>
<script src="JS/index.js"></script>
